[package]
name = "stasis-input"
description = "Hotkeys, and the guarantee that input goes back to the game"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log = { workspace = true }
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# The integration test and the example live outside the crate, so they need the
# same bindings declared again rather than inheriting them.
[dev-dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
