[package]
name = "stasis-detect"
description = "Finds running games and the window to draw over, without opening the game process"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log = { workspace = true }
# The feature list is the API surface this crate is allowed to touch, so it is
# worth reading as one. Win32_System_ProcessStatus is deliberately absent:
# EnumProcessModulesEx would read a game's module list, and it needs a handle
# with PROCESS_VM_READ, which is the access a memory cheat asks for. The
# Toolhelp snapshot in Win32_System_Diagnostics_ToolHelp answers the same
# question without opening the process at all.
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
