name: CI

# Windows only, because that is what the project actually supports. The macOS
# and Linux path detection in steam.rs has never been run, so building there
# would report a green tick for something nobody has verified.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tsc, then clippy with warnings as errors, then a formatting check. These
      # are the same three commands CONTRIBUTING.md asks contributors to run.
      - name: Lint
        run: npm run lint

      - name: Rust tests
        run: npm run test:rust

      - name: Frontend tests
        run: npm run test:ui

      # Proves the app still bundles, which the tests above do not cover.
      - name: Build
        run: npm run build

  # A full installer build is slow and only matters for a release, so it runs on
  # tags rather than on every push.
  bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the installers
        run: npm run tauri build

      # Unsigned, so SmartScreen will warn on anything downloaded from here.
      # Code signing is still open in TODO.md section 6.
      - uses: actions/upload-artifact@v4
        with:
          name: stasis-windows-unsigned
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
