[package]
name = "stasis"
version = "0.1.0"
description = "Game overlay host"
license = "Apache-2.0"
authors = ["Jrnilsen01"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stasis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The first-party log plugin, so the file location, the size cap, and the
# rotation are one piece of configuration rather than hand-rolled file handling.
tauri-plugin-log = "2"
# Already in the lock file as a transitive dependency, so this adds no download.
# Declaring it directly is what lets this crate's own modules call the macros
# the plugin routes to a file.
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
# Already in the lock file as a transitive dependency, so this adds no download
# and nothing to the shipped binary.
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
